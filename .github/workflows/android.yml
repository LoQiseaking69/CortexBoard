name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      model_url:
        description: "GGUF to bake into the APK (Hugging Face resolve URL)"
        required: false
        default: "https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf"
      model_name:
        description: "Display name for the bundled model"
        required: false
        default: "Qwen3-0.6B-Q8_0"
      bundle_model:
        description: "Bundle the model (false = lite APK, import GGUF in-app)"
        type: boolean
        default: true

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  LLAMA_TAG: b11549
  NDK_VERSION: 29.0.13113456
  CMAKE_VERSION: 3.31.6
  MODEL_URL: ${{ inputs.model_url || 'https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf' }}
  MODEL_NAME: ${{ inputs.model_name || 'Qwen3-0.6B-Q8_0' }}
  BUNDLE_MODEL: ${{ github.event_name != 'workflow_dispatch' || inputs.bundle_model }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages (platform, NDK, CMake)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          yes | "$SDKM" --licenses > /dev/null || true
          .github/scripts/run.sh "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cache llama.cpp source
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: third_party/llama.cpp
          key: llama-src-${{ env.LLAMA_TAG }}

      - name: Fetch llama.cpp ${{ env.LLAMA_TAG }}
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp

      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "CB_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "CB_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "CB_KEY_ALIAS=$KEY_ALIAS"
              echo "CB_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with release keystore"
          else
            echo "::warning::No KEYSTORE_BASE64 secret — APK is signed with an ephemeral debug key (updates will need a reinstall)."
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$(tr -d ' \n' < VERSION)"
          release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"; release=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] && \
               ! gh release view "v$base" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            v="$base"; release=true   # VERSION bumped on main and not yet released
          else
            v="$base-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version $v (release=$release)"

      - name: Build lite APK
        run: |
          chmod +x gradlew
          .github/scripts/run.sh ./gradlew --no-daemon assembleRelease \
            -PmodelName="none" -PmodelUrl="$MODEL_URL" \
            -PversionName="${{ steps.ver.outputs.name }}" \
            -PversionCode="${GITHUB_RUN_NUMBER}" \
            --stacktrace
          out="dist/CortexBoard-${{ steps.ver.outputs.name }}-lite.apk"
          mkdir -p dist && cp app/build/outputs/apk/release/app-release.apk "$out"
          ls -lh "$out"

      - name: Model cache key
        id: model-key
        run: echo "key=gguf-$(echo -n "$MODEL_URL" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache model weights
        if: env.BUNDLE_MODEL == 'true'
        id: model-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models/model.gguf
          key: ${{ steps.model-key.outputs.key }}

      - name: Download ${{ env.MODEL_NAME }}
        if: env.BUNDLE_MODEL == 'true' && steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/src/main/assets/models
          curl -L --fail --retry 4 --retry-delay 10 -o app/src/main/assets/models/model.gguf "$MODEL_URL"

      - name: Verify GGUF
        if: env.BUNDLE_MODEL == 'true'
        run: |
          f=app/src/main/assets/models/model.gguf
          magic=$(head -c 4 "$f")
          [ "$magic" = "GGUF" ] || { echo "::error::downloaded file is not GGUF"; exit 1; }
          ls -lh "$f"
          sha256sum "$f" | tee model.sha256

      - name: Build full (bundled model) APK
        if: env.BUNDLE_MODEL == 'true'
        run: |
          chmod +x gradlew
          .github/scripts/run.sh ./gradlew --no-daemon assembleRelease \
            -PmodelName="$MODEL_NAME" \
            -PversionName="${{ steps.ver.outputs.name }}" \
            -PversionCode="${GITHUB_RUN_NUMBER}" \
            --stacktrace
          out="dist/CortexBoard-${{ steps.ver.outputs.name }}-${MODEL_NAME}.apk"
          mkdir -p dist && cp app/build/outputs/apk/release/app-release.apk "$out"
          ls -lh "$out"

      - name: Checksums and summary
        run: |
          cd dist && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS
          {
            echo "### CortexBoard ${{ steps.ver.outputs.name }}"
            echo "- llama.cpp: \`$LLAMA_TAG\`"
            echo "- lite: downloads ${MODEL_NAME} on first launch"
            ls -lh *.apk | awk '{print "- " $9 ": " $5}'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: CortexBoard-${{ steps.ver.outputs.name }}
          path: dist/
          compression-level: 0
          retention-days: 14

      - name: GitHub Release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: CortexBoard ${{ steps.ver.outputs.name }}
          files: dist/*
          generate_release_notes: true
